name: Google Drive Library
slug: gdrive
type: plugin
version: 0.1.2
description: Shared Google Drive library for Grav plugins. Service-account and OAuth (bring your own client) accounts, a thin Drive v3 client, and the OAuth callback. No Composer dependencies.
icon: google
author:
  name: Sandy McArthur
  email: sandy@mcarthur.org
  url: https://sandy.mcarthur.org
homepage: https://github.com/sandymac/grav-plugin-gdrive
bugs: https://github.com/sandymac/grav-plugin-gdrive/issues
keywords: google drive, google, oauth, service account, library
license: MIT
compatibility:
  grav: ["2.0"]

dependencies:
  - { name: grav, version: ">=2.0.23" }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: true
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    # Tab keys double as Admin2's URL hash (#oauth, #troubleshooting); Setup::render
    # rewrites links between the guides to them, so keep the two in step.
    tabs:
      type: tabs
      fields:
        start:
          type: tab
          title: Start here
          fields:
            start_guide:
              type: display
              style: vertical
              markdown: true
              data-content@: ['\Grav\Plugin\Gdrive\Setup::guide', 'start-here']
            start_checklist:
              type: display
              style: vertical
              markdown: true
              data-content@: '\Grav\Plugin\Gdrive\Setup::checklist'
            start_who:
              type: display
              style: vertical
              markdown: true
              data-content@: '\Grav\Plugin\Gdrive\Setup::whoUsesWhat'

        accounts_tab:
          type: tab
          title: Accounts
          fields:
            # Display only: the component talks to /api/v1/gdrive and never sends a
            # form value. validate.ignore makes the config save drop the key anyway.
            account_manager:
              type: gdrive-accounts
              validate:
                ignore: true

        service_account:
          type: tab
          title: Service account guide
          fields:
            service_account_guide:
              type: display
              style: vertical
              markdown: true
              data-content@: ['\Grav\Plugin\Gdrive\Setup::guide', 'service-account']

        oauth:
          type: tab
          title: OAuth guide
          fields:
            oauth_guide:
              type: display
              style: vertical
              markdown: true
              data-content@: ['\Grav\Plugin\Gdrive\Setup::guide', 'oauth']

        troubleshooting:
          type: tab
          title: Troubleshooting
          fields:
            troubleshooting_guide:
              type: display
              style: vertical
              markdown: true
              data-content@: ['\Grav\Plugin\Gdrive\Setup::guide', 'troubleshooting']
