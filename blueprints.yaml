name: Google Drive Auth
slug: gdrive-auth
type: plugin
version: 0.1.15
description: Google sign-in for the Google Drive plugin family. Connect a Google account once, with OAuth (your own Google Cloud client) or a service account, and every compatible Drive plugin (one built on Google Drive Auth) can use it. Includes guided setup, the Drive client and the OAuth callback. No Composer dependencies.
icon: google
author:
  name: Sandy McArthur
  email: sandy@mcarthur.org
  url: https://sandy.mcarthur.org
homepage: https://github.com/sandymac/grav-plugin-gdrive-auth
bugs: https://github.com/sandymac/grav-plugin-gdrive-auth/issues
keywords: google drive, google, oauth, service account, library
license: MIT
compatibility:
  grav: ["2.0"]

dependencies:
  - { name: grav, version: ">=2.0.23" }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: true
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    # Tab keys double as Admin2's URL hash (#oauth, #troubleshooting); Setup::render
    # rewrites links between the guides to them, so keep the two in step.
    tabs:
      type: tabs
      fields:
        start:
          type: tab
          title: Start here
          fields:
            start_guided:
              type: display
              style: vertical
              markdown: true
              content: 'Want only your steps? Use [Guided setup](#guided).'
            start_guide:
              type: display
              style: vertical
              markdown: true
              data-content@: ['\Grav\Plugin\Gdrive\Setup::guide', 'start-here']
            start_checklist:
              type: display
              style: vertical
              markdown: true
              data-content@: '\Grav\Plugin\Gdrive\Setup::checklist'
            start_who:
              type: display
              style: vertical
              markdown: true
              data-content@: '\Grav\Plugin\Gdrive\Setup::whoUsesWhat'

        guided:
          type: tab
          title: Guided setup
          fields:
            guided_intro:
              type: display
              style: vertical
              markdown: true
              content: 'Answer a few questions and see only the steps you need. The full, unabridged guides are on the other tabs: [Start here](#start), [OAuth](#oauth), [Service account](#service_account) and [Troubleshooting](#troubleshooting).'
            # Display only, like account_manager: it renders GET /api/v1/gdrive/guide and never sends a form value.
            guided_setup:
              type: gdrive-guide
              validate:
                ignore: true

        accounts_tab:
          type: tab
          title: Accounts
          fields:
            # Display only: the component talks to /api/v1/gdrive and never sends a
            # form value. validate.ignore makes the config save drop the key anyway.
            account_manager:
              type: gdrive-accounts
              validate:
                ignore: true

        oauth:
          type: tab
          title: OAuth guide
          fields:
            oauth_guide:
              type: display
              style: vertical
              markdown: true
              data-content@: ['\Grav\Plugin\Gdrive\Setup::guide', 'oauth']

        service_account:
          type: tab
          title: Service account guide
          fields:
            service_account_guide:
              type: display
              style: vertical
              markdown: true
              data-content@: ['\Grav\Plugin\Gdrive\Setup::guide', 'service-account']

        troubleshooting:
          type: tab
          title: Troubleshooting
          fields:
            troubleshooting_guide:
              type: display
              style: vertical
              markdown: true
              data-content@: ['\Grav\Plugin\Gdrive\Setup::guide', 'troubleshooting']
